name: CI/CD - Build e distribuição Android

on:
  push:
    branches:
      - main
      - feat/update-in-app-github-releases
  # Execução manual: serve para testar a publicação numa branch antes do PR.
  # "nenhum" só gera o build e envia ao Firebase; as demais opções forçam a
  # publicação de uma Release com o incremento escolhido.
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar Release? (incremento sobre a última tag)"
        type: choice
        options:
          - nenhum
          - patch
          - minor
          - major
        default: nenhum

# Na main as execuções entram em fila (e não se cancelam), para que duas
# publicações seguidas nunca calculem a mesma versão.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# "write" é usado para criar a tag e a Release.
permissions:
  contents: write

jobs:
  build-and-distribute:
    name: Build APK e enviar ao Firebase App Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: default

    steps:
      # Histórico e tags completos: a versão é calculada a partir da última tag.
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versionamento 100% automático: a versão não depende do pubspec.yaml.
      #
      # Base: a última tag vMAJOR.MINOR.PATCH (as tags são criadas só por este
      # workflow, junto com a Release).
      #
      # Publica Release quando:
      #   - push na main que alterou arquivos do app desde a última tag
      #     (lib/, assets/, android/, pubspec.yaml/lock); docs, testes e CI
      #     sozinhos não geram atualização para os usuários; ou
      #   - execução manual com incremento diferente de "nenhum".
      # Incremento (push na main): "!:" ou BREAKING CHANGE -> major; "feat:" ->
      # minor; qualquer outro -> patch. Sem Release, o build usa a versão da
      # última tag (não aparece como atualização para quem já a tem).
      #
      # versionCode derivado da versão (e não só do run_number): um build de
      # versão maior sempre tem código maior que o de versão menor, então o
      # Android não recusa o APK da Release por downgrade:
      #   versionCode = (MAJOR*10000 + MINOR*100 + PATCH) * 10000 + run_number
      - name: Calcular versão do app (versionName e versionCode)
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          APP_PATHS='^(lib/|assets/|android/|pubspec\.yaml$|pubspec\.lock$)'

          LAST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -z "$LAST_TAG" ]; then BASE="0.0.0"; RANGE="HEAD"; else BASE="${LAST_TAG#v}"; RANGE="$LAST_TAG..HEAD"; fi

          BUMP=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -n "$INPUT_RELEASE" && "$INPUT_RELEASE" != "nenhum" ]]; then BUMP="$INPUT_RELEASE"; fi
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [ -z "$LAST_TAG" ]; then
              CHANGED="primeira-release"
            else
              CHANGED=$(git diff --name-only "$LAST_TAG" HEAD | grep -E "$APP_PATHS" || true)
            fi
            if [ -n "$CHANGED" ]; then
              MESSAGES=$(git log "$RANGE" --format='%s%n%b')
              if grep -Eq '^[a-z]+(\(.*\))?!:|BREAKING CHANGE' <<< "$MESSAGES"; then BUMP="major"
              elif grep -Eq '^feat(\(.*\))?:' <<< "$MESSAGES"; then BUMP="minor"
              else BUMP="patch"; fi
            else
              echo "Nenhum arquivo do app mudou desde ${LAST_TAG}: sem Release."
            fi
          fi

          [[ "$BASE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"

          # Limites para o versionCode caber no int do Android (máx. 2.147.483.647).
          if (( MAJOR > 20 || MINOR > 99 || PATCH > 99 )); then
            echo "::error::Versão $VERSION_NAME fora do limite suportado (MAJOR <= 20, MINOR <= 99, PATCH <= 99)."
            exit 1
          fi
          if (( RUN_NUMBER > 9999 )); then
            echo "::error::run_number $RUN_NUMBER acima de 9999: revise a fórmula do versionCode."
            exit 1
          fi
          VERSION_CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 10000 + RUN_NUMBER ))

          if [ -n "$BUMP" ]; then
            echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"
            echo "Release v$VERSION_NAME ($BUMP sobre ${LAST_TAG:-nenhuma tag}), versionCode=$VERSION_CODE"
          else
            echo "Sem Release. versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          fi
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Criar google-services.json a partir do Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON não configurado."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código (lint)
        run: flutter analyze

      - name: Rodar testes
        run: flutter test

      # Keystore fixo: o mesmo certificado em todo build evita conflito de
      # assinatura ao atualizar o app nos celulares dos testadores.
      - name: Restaurar keystore de assinatura a partir do Secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 não configurado."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # versionName e versionCode vêm do passo de versão acima (o "version" do
      # pubspec.yaml é ignorado pelo build do CI).
      - name: Build do APK (release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$APP_VERSION_CODE"

      # Release pública (não rascunho nem pré-lançamento): é o que o endpoint
      # /releases/latest devolve ao app, sem token. A tag é criada aqui, no
      # commit do build, só depois de o APK compilar. Tags criadas com o token
      # do workflow não disparam uma nova execução. Roda antes do Firebase para
      # que uma falha da distribuição aos testadores não atrase os usuários.
      - name: Publicar GitHub Release com o APK
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="mente-leve-${RELEASE_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "MenteLeve ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Enviar APK ao Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Versão: ${{ env.APP_VERSION_NAME }} (${{ env.APP_VERSION_CODE }})
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Mensagem: ${{ github.event.head_commit.message }}
