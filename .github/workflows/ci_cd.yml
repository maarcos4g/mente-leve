name: CI/CD - Build e distribuição Android

on:
  push:
    branches:
      - main
      - feat/update-in-app-github-releases
    # Tag vX.Y.Z publica também uma GitHub Release com o APK, que o app
    # consulta para a atualização in-app.
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# "write" só é usado para criar a Release em builds de tag.
permissions:
  contents: write

jobs:
  build-and-distribute:
    name: Build APK e enviar ao Firebase App Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: default

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Fonte única de versão: o "version" do pubspec.yaml. O app compara a tag
      # da Release com o versionName instalado, então, em build de tag, a tag
      # precisa ser vMAJOR.MINOR.PATCH e igual ao pubspec (suba o pubspec no PR
      # antes de criar a tag).
      #
      # O versionCode é derivado da versão (e não só do run_number): qualquer
      # build de uma versão maior tem código maior que qualquer build de uma
      # versão menor. Sem isso, um build comum do Firebase com run_number alto
      # impediria o Android de instalar, por cima, o APK de uma Release mais
      # nova (INSTALL_FAILED_VERSION_DOWNGRADE).
      #   versionCode = (MAJOR*10000 + MINOR*100 + PATCH) * 10000 + run_number
      - name: Calcular versão do app (versionName e versionCode)
        run: |
          VERSION_NAME=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n1 | tr -d '\r')
          if ! [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Versão '$VERSION_NAME' do pubspec.yaml inválida. Use MAJOR.MINOR.PATCH+BUILD (ex.: 1.2.0+1)."
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' diferente da versão do pubspec.yaml ('v$VERSION_NAME'). Ajuste o pubspec.yaml e crie a tag novamente."
              exit 1
            fi
          fi

          # Limites para o versionCode caber no int do Android (máx. 2.147.483.647).
          if (( MAJOR > 20 || MINOR > 99 || PATCH > 99 )); then
            echo "::error::Versão $VERSION_NAME fora do limite suportado (MAJOR <= 20, MINOR <= 99, PATCH <= 99)."
            exit 1
          fi
          if (( ${{ github.run_number }} > 9999 )); then
            echo "::error::run_number ${{ github.run_number }} acima de 9999: revise a fórmula do versionCode."
            exit 1
          fi

          VERSION_CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 10000 + ${{ github.run_number }} ))
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Criar google-services.json a partir do Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON não configurado."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código (lint)
        run: flutter analyze

      - name: Rodar testes
        run: flutter test

      # Keystore fixo: o mesmo certificado em todo build evita conflito de
      # assinatura ao atualizar o app nos celulares dos testadores.
      - name: Restaurar keystore de assinatura a partir do Secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 não configurado."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # versionName vem do pubspec.yaml e versionCode da fórmula calculada acima
      # (o "+BUILD" do pubspec é ignorado em favor do --build-number).
      - name: Build do APK (release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION_NAME" \
            --build-number="$APP_VERSION_CODE"

      # Release pública (não rascunho nem pré-lançamento): é o que o endpoint
      # /releases/latest devolve ao app, sem token. Roda antes do Firebase para
      # que uma falha da distribuição aos testadores não atrase os usuários.
      - name: Publicar GitHub Release com o APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="mente-leve-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --verify-tag \
              --title "MenteLeve ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Enviar APK ao Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Mensagem: ${{ github.event.head_commit.message }}
